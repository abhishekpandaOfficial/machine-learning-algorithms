<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Credit default risk prediction</title>
  <desc id="desc">A stylized credit card and probability chart for a logistic regression project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1390" cy="75" r="220" fill="#60a5fa" opacity=".18"/>
  <circle cx="1480" cy="430" r="260" fill="#93c5fd" opacity=".12"/>
  <g transform="translate(120 105) rotate(-8)">
    <rect width="610" height="330" rx="28" fill="url(#card)"/>
    <rect y="64" width="610" height="42" fill="#1d4ed8" opacity=".88"/>
    <rect x="55" y="145" width="106" height="78" rx="12" fill="#fbbf24"/>
    <circle cx="475" cy="224" r="48" fill="#ef4444" opacity=".85"/>
    <circle cx="525" cy="224" r="48" fill="#f97316" opacity=".78"/>
    <text x="55" y="282" font-family="Arial, sans-serif" font-size="26" fill="#1e3a8a" font-weight="700">RISK • CLASSIFICATION</text>
  </g>
  <g transform="translate(900 125)" fill="none" stroke="#bfdbfe" stroke-width="7" stroke-linecap="round">
    <path d="M0 260 C100 245 135 225 205 215 S315 110 400 135 S535 190 635 40"/>
    <path d="M0 300 H650" opacity=".35"/>
    <path d="M20 20 V300" opacity=".35"/>
  </g>
  <text x="900" y="105" font-family="Arial, sans-serif" font-size="34" fill="#dbeafe" font-weight="700">LOGISTIC REGRESSION</text>
  <text x="900" y="405" font-family="Arial, sans-serif" font-size="28" fill="#eff6ff">Credit Default Risk Studio</text>
</svg>
