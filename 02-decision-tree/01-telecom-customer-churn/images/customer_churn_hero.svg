<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Telecom customer churn decision tree</title>
  <desc id="desc">A stylized decision tree with customer connection nodes for a churn project.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#4c0519"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <g stroke="#fecdd3" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M360 125 L205 270 M360 125 L515 270 M205 270 L115 410 M205 270 L295 410 M515 270 L425 410 M515 270 L605 410"/>
  </g>
  <g fill="#fff1f2" stroke="#9f1239" stroke-width="9">
    <circle cx="360" cy="125" r="58"/><circle cx="205" cy="270" r="52"/><circle cx="515" cy="270" r="52"/>
    <circle cx="115" cy="410" r="42"/><circle cx="295" cy="410" r="42"/><circle cx="425" cy="410" r="42"/><circle cx="605" cy="410" r="42"/>
  </g>
  <g fill="#9f1239" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">
    <text x="360" y="135">?</text><text x="205" y="280">A</text><text x="515" y="280">B</text>
    <text x="115" y="420">N</text><text x="295" y="420">Y</text><text x="425" y="420">N</text><text x="605" y="420">Y</text>
  </g>
  <text x="820" y="155" font-family="Arial, sans-serif" font-size="40" fill="#ffe4e6" font-weight="700">DECISION TREE</text>
  <text x="820" y="260" font-family="Arial, sans-serif" font-size="36" fill="#fff1f2">Customer Churn Studio</text>
  <text x="820" y="420" font-family="Arial, sans-serif" font-size="27" fill="#fecdd3">Learn • Evaluate • Explain</text>
</svg>
