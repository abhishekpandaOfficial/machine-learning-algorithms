<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Machine learning lifecycle</title><desc id="d">Six stages from problem definition and data to training, evaluation, deployment, and monitoring.</desc>
<rect width="1200" height="320" rx="24" fill="#f8fafc"/><text x="40" y="50" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">The machine-learning lifecycle</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><rect x="35" y="105" width="165" height="110" rx="15" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="117" y="145" font-size="17" font-weight="700" fill="#1e3a8a">1. Define</text><text x="117" y="173" font-size="14" fill="#1e3a8a">Problem &amp; target</text></g>
<g><rect x="230" y="105" width="165" height="110" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="312" y="145" font-size="17" font-weight="700" fill="#166534">2. Understand</text><text x="312" y="173" font-size="14" fill="#166534">Collect &amp; inspect</text></g>
<g><rect x="425" y="105" width="165" height="110" rx="15" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="507" y="145" font-size="17" font-weight="700" fill="#92400e">3. Prepare</text><text x="507" y="173" font-size="14" fill="#92400e">Split &amp; transform</text></g>
<g><rect x="620" y="105" width="165" height="110" rx="15" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="702" y="145" font-size="17" font-weight="700" fill="#5b21b6">4. Train</text><text x="702" y="173" font-size="14" fill="#5b21b6">Fit &amp; compare</text></g>
<g><rect x="815" y="105" width="165" height="110" rx="15" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="897" y="145" font-size="17" font-weight="700" fill="#9f1239">5. Evaluate</text><text x="897" y="173" font-size="14" fill="#9f1239">Errors &amp; metrics</text></g>
<g><rect x="1010" y="105" width="155" height="110" rx="15" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="1087" y="145" font-size="17" font-weight="700" fill="#155e75">6. Deploy</text><text x="1087" y="173" font-size="14" fill="#155e75">Monitor &amp; update</text></g>
</g>
<g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M200 160 H225 l-8 -6 m8 6 l-8 6"/><path d="M395 160 H420 l-8 -6 m8 6 l-8 6"/><path d="M590 160 H615 l-8 -6 m8 6 l-8 6"/><path d="M785 160 H810 l-8 -6 m8 6 l-8 6"/><path d="M980 160 H1005 l-8 -6 m8 6 l-8 6"/></g>
<text x="600" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Repeat the cycle when monitoring reveals drift, new data, or changing requirements.</text>
</svg>